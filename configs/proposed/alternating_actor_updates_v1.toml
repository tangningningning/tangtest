# Sole formal configuration for Alternating Actor Optimization V1.
# Capacities use decimal GB-to-MB conversion (1 GB = 1000 MB).
# 本文件统一承载正式物理系统、数据生成、成本、奖励和训练参数。
# 训练时必须使用独立的 --run-dir，例如 runs/adaptive_alternating_actor_updates_v1。
# adaptive_cache_mec 统一系统配置入口
#
# 本文件是后续所有模块的唯一系统参数入口。场景生成、任务生成、车辆预测、
# 流行度预测、预测场景生成、缓存配置、UAV 优化、Matching、KKT 和 PPO
# 都应读取这里，避免不同模块各自维护 CPU、带宽、缓存容量、
# UAV 参数、通信参数和 cost 参数。
#
# 数据依赖说明：
# 【仅修改以下参数通常不需要重新跑 SUMO】
# cache capacity、CPU、bandwidth、cache cost、UAV 算法参数、PPO 参数。
#
# 【修改以下参数需要重新生成 task 数据】
# service.count、task.arrival_probability、task.popularity_zeta、
# task.popularity_epoch_length、service generation 参数、D/L 扰动参数。
#
# 【修改以下参数需要重新运行 vehicle prediction】
# simulation.dt_s、prediction.vehicle.sigma_position_m、
# prediction.vehicle.sigma_speed_mps、prediction.vehicle.horizon。
#
# 【修改以下参数需要重新训练 GRU】
# service.count、服务大小/输入大小/计算密度范围、popularity 过程、
# prediction.popularity.history_length、
# prediction.vehicle.horizon / prediction.popularity.horizon。
#
# 【修改 H_p】
# 必须重新生成 residual_blocks、GRU checkpoint 和 prediction_scenarios。
#
# 【修改 S】
# 只需要重新生成 prediction_scenarios，不需要重新运行 SUMO/Kalman/GRU 训练。

[experiment]
# 实验名称。用于后续结果 metadata 和配置快照引用；修改它不需要重新生成数据。
name = "ALTERNATING_ACTOR_UPDATES_V1"
# 主实验随机种子。当前沿用已有正式数据中的主 seed；修改后若用于生成任务/预测场景，需要重跑对应上游模块。
seed = 4401
# 重复实验编号。只用于后续批量实验标识，不改变系统物理模型。
repeat_index = 0
# 输出标签。用于后续 result 文件命名；修改它不需要重新生成上游数据。
output_tag = "alternating_actor_updates_v1"

[paths]
# 已生成服务目录。缓存模块必须从该 JSON 读取实际 s_f / D / cycles_per_bit，
# 不在本 TOML 中复制具体服务，避免两份 service catalog 不一致。
service_catalog = "environment_data/proposed_joint_training/service_catalog_500_1000.json"
# 车辆角色文件。SV/TV 真实 ID 从这里读取，不在本配置中写死车辆 ID。
vehicle_roles = "data/generated/vehicle_roles.json"
# 正式 SUMO 轨迹与任务/流行度输入的固定 artifact 路径。
trajectory = "data/generated/trajectory.csv"
vehicle_predictions = "data/generated/vehicle_predictions.csv"
popularity = "data/generated/popularity.csv"
popularity_predictions = "data/generated/popularity_predictions.csv"
tasks = "data/generated/tasks.csv"
# 当前预测场景文件。cache optimizer 只能读取该预测输入，不能读取未来真实任务。
prediction_scenarios = "data/generated/prediction_scenarios.npz"
# SUMO 路网文件。用于节点自动部署、车辆预测和道路约束。
sumo_net = "data/sumo/map/osm.net.xml.gz"
# RSU/UAV 节点位置从正式 node_positions.json 读取。
node_positions = "data/generated/node_positions.json"
# 保留的残差库路径字段；正式生成器读取 paths.vehicle_residual_bank。
residual_bank = "data/generated/residual_blocks.npz"
# 校准输入路径元数据；正式 episode 生成器不读取这两个输入字段。
vehicle_calibration_roles = "data/calibration/vehicle_roles.json"
vehicle_calibration_trajectory = "data/calibration/trajectory.csv"
# 由 vehicle_prediction.py 从独立 calibration trajectory 冻结生成的 Q/R/residual bank。
vehicle_residual_bank = "data/calibration/residual_blocks.npz"
# 正式任务生成器输出的 L_rho 请求 prehistory。
popularity_history = "data/generated/popularity_history.csv"
# GRU checkpoint。修改 popularity 预测训练参数后需要重新训练。
popularity_gru = "data/generated/popularity_gru.pt"

[simulation]
# SUMO 基础时间步，同时也是 MEC 基础 slot，单位 s。当前实际值来自已生成数据。
dt_s = 1.0
# warm-up 时间，单位 s。只用于建立历史状态，不计入正式系统效用。
warmup_time_s = 100.0
# 正式优化 episode 长度，单位 s。当前正式数据覆盖 300 个 slot。
episode_time_s = 300.0
# 研究车辆数量。正式固定值为 5 SV + 20 TV；ID 从 vehicle_roles.json 读取。
num_research_vehicles = 25
# TV 数量。正式固定值为 20；TV ID 从 vehicle_roles.json 读取。
num_task_vehicles = 20
# SV 数量。正式固定值为 5；SV ID 从 vehicle_roles.json 读取。
num_service_vehicles = 5
# SUMO / 角色筛选主 seed。当前实际值来自已有 vehicle_roles.json。
sumo_seed = 4401
# 交通需求 seed。当前项目未单独冻结 traffic_seed，先沿用 sumo_seed；如后续拆分需重新生成 SUMO 轨迹。
traffic_seed = 4401
# randomTrips 出发窗口的实际边界，单位 s；metadata 会记录这两个值。
random_trips_departure_begin_s = 0.0
random_trips_departure_end_s = 60.0
random_trips_period_s = 1.0
random_trips_min_distance_m = 4000.0
random_trips_intermediate = 2
random_trips_maxtries = 1000

[execution]
# 每个 slot 独立完成任务卸载、资源分配、时延/能耗评价；不跨 slot 保存任务状态。
cross_slot_task_model = "independent_per_slot"

[service]
# 服务总数 F。正式固定值为 10；修改后必须通过统一入口重生成依赖 artifact，
# 生成新的 service_catalog.json、popularity.csv、tasks.csv，并重跑依赖链。
count = 10

[service.generation]
# Table I 校准的服务缓存大小范围，单位 GB；运行时 program_size 由生成器换算为 MB。
service_size_min_gb = 2.0
service_size_max_gb = 20.0
# Table I 校准的任务输入基准范围，单位 KB；任务行仍以 bit 保存。
input_size_min_kb = 500.0
input_size_max_kb = 1000.0
# Table I 校准的计算密度范围，单位 cycle/bit。
cycles_per_bit_min = 400.0
cycles_per_bit_max = 1000.0

[task]
# Bernoulli 任务到达概率 lambda。正式固定值为 0.7；修改需要重生成任务。
arrival_probability = 0.7
# Zipf 指数 zeta。当前实际值；修改会改变真实 rho_star，需要重生成 popularity/tasks。
popularity_zeta = 0.8
# popularity epoch 长度，单位 slot。当前实际值 20。
popularity_epoch_length = 20
# 每个 epoch 的局部 rank 变化次数。当前实际值 1。
popularity_changes_per_epoch = 1
# 输入数据 D 的相对扰动范围，当前为 ±20%。修改需要重生成 tasks.csv。
input_relative_jitter = 0.20
# 计算负载 L 的相对扰动范围，当前为 ±10%。修改需要重生成 tasks.csv。
load_relative_jitter = 0.10
# 任务生成主 seed。当前实际值与正式数据一致。
master_seed = 4401

[nodes.vehicle]
# 车辆上传发射功率，单位 W。
# VEC 地面通信基线采用 23 dBm，换算为 0.1995262315 W。
# 注意：system_model.py 的 Shannon 公式只使用 W 线性单位，不直接使用 dBm。
# 这是文献校准实验基线，不代表硬件实测数据。
transmit_power_w = 0.1995262315

[nodes.sv]
# SV 公共缓存容量，单位 MB；由 cache.capacity_policy.sv_ratio 自动生成。
cache_capacity_mb = 12000
# 统一 Cache 回传仿真基准，单位 bit/s；Liu et al., IEEE TWC 2024, DOI 10.1109/TWC.2024.3430486。
# SV/UAV 采用同一数值是本项目的抽象实验假设，不代表原论文实测其无线回传能力。
cache_backhaul_rate_bps = 200.0e6
# SV 总 CPU 能力，单位 cycle/s。
# 正式固定值：SV 总 CPU 能力为 1GHz，单位 cycle/s。
# 这是文献校准实验基线，不代表硬件实测数据。
cpu_cycles_per_s = 1.0e9
# SV 链路带宽，单位 Hz。
# 第一版地面 V2V/V2I 统一采用 10MHz 系统带宽，并与 b_vm 正交资源比例模型配套。
# 这是文献校准实验基线，不代表硬件实测数据。
bandwidth_hz = 10.0e6
# 正式 Cache 候选评分使用的 SV 服务距离尺度；不作为 Matching/KKT 的硬覆盖截断。
range_m = 100.0

[nodes.rsu]
# RSU 数量；坐标由 node_positions.json 自动生成。
count = 2
# RSU 初始部署高度，单位 m；节点部署脚本从此参数生成位置文件。
deployment_altitude_m = 10.0
# RSU 公共缓存容量，单位 MB；由 cache.capacity_policy.rsu_ratio 自动生成。
cache_capacity_mb = 25000
# 统一 Cache 回传仿真基准，单位 bit/s；Liu et al., IEEE TWC 2024, DOI 10.1109/TWC.2024.3430486。
cache_backhaul_rate_bps = 200.0e6
# RSU 总 CPU 能力，单位 cycle/s。
# 正式固定值：RSU MEC server computation rate 为 5GHz。
cpu_cycles_per_s = 10.0e9
# RSU 带宽，单位 Hz。
# 第一版地面 V2V/V2I 统一采用 10MHz 系统带宽，并与 b_vm 正交资源比例模型配套。
# 这是文献校准实验基线，不代表硬件实测数据。
bandwidth_hz = 10.0e6
# 正式 Cache 候选评分使用的 RSU 服务距离尺度；不作为 Matching/KKT 的硬覆盖截断。
range_m = 250.0

[nodes.uav]
# UAV 数量；坐标由 node_positions.json 自动生成。
count = 2
# UAV 固定高度，单位 m；部署位置和空地信道共用同一高度合同。
deployment_altitude_m = 100.0
# UAV 相对 RSU 的初始偏移占路网最大尺度的比例。
deployment_offset_fraction = 0.1
# UAV 初始水平位置从正式 node_positions.json 读取。
# 该初始位置不是未来真实轨迹，也不是论文固定部署结论；后续位置仍由优化算法调整。
initialization_mode = "topology_aware"
# 参数状态：文献校准实验基线。
# UAV 固定飞行高度，单位 m；必须与 deployment_altitude_m 一致。
# 文献来源：Li et al., Collaborative offloading for UAV-enabled time-sensitive MEC networks,
# EURASIP Journal on Wireless Communications and Networking 2021:1,
# DOI 10.1186/s13638-020-01861-8，Table 1 采用 UAV altitude H = 100m。
# 本文只优化 UAV 二维水平位置，不优化高度；该值是仿真基线，不代表唯一硬件/法规参数。
altitude_m = 100.0
# UAV 公共缓存容量，单位 MB；由 cache.capacity_policy.uav_ratio 自动生成。
cache_capacity_mb = 20000
# 统一 Cache 回传仿真基准，单位 bit/s；Liu et al., IEEE TWC 2024, DOI 10.1109/TWC.2024.3430486。
# 对 UAV 使用该值是本项目的抽象实验假设，不代表原论文实测 UAV 无线回传能力。
cache_backhaul_rate_bps = 200.0e6
# UAV 总 CPU 能力，单位 cycle/s。
# 正式固定值：UAV MEC computation rate 为 5GHz。
cpu_cycles_per_s = 5.0e9
# UAV 链路带宽，单位 Hz。
# 文献来源同上，Table 1 给出 Total bandwidth B = 10 MHz；
# 当前系统将 UAV bandwidth_hz 作为空地 uplink_rate() 的系统带宽输入，
# 因此 10 MHz 直接换算为 10.0e6 Hz。
# 这是文献校准实验基线，不代表硬件实测值。
bandwidth_hz = 10.0e6
# 正式 UAV 候选评分使用的服务距离尺度；不作为 Matching/KKT 的硬覆盖截断。
range_m = 300.0
# 参数状态：文献校准实验基线。
# UAV 最大水平飞行速度，单位 m/s。
# 文献来源同 Li et al., DOI 10.1186/s13638-020-01861-8，Table 1 采用最大 UAV 速度 15m/s。
max_horizontal_speed_mps = 15.0
# 系统模型 C8：任意两个 UAV 在同一时隙满足
# ||q_u(t) - q_u'(t)||_2 >= d_U_min，单位 m。
# 主实验采用 d_U_min = 10m，作为文献校准实验固定值；
# 该值不是航空法规强制值、硬件实测值或通用安全标准。
# 文献依据1：Xiang et al., "Towards Power-Efficient Aerial Communications via
# Dynamic Multi-UAV Cooperation," IEEE WCNC 2020, DOI: 10.1109/WCNC45663.2020.9120587；
# 该文多 UAV 空中通信仿真采用 d_min = 10m。
# 文献依据2：Peng and Zhang, "Efficient dynamic cooperative deployment and task
# scheduling in multi-UAV-assisted MEC for dense dynamic environments," Scientific Reports,
# 2026, DOI: 10.1038/s41598-026-59305-0；该 multi-UAV-assisted MEC 场景采用 d_safe = 10m。
min_safety_distance_m = 10.0

[nodes.uav.movement]
# 参数状态：LITERATURE_DERIVED；literature rotor-model equivalent mapping。
# 等效单位水平移动距离能耗，单位 J/m。
# Li et al., DOI 10.1186/s13638-020-01861-8，Table 1 给出旋翼 UAV 功率模型参数，
# 但论文并未直接给出“15 J/m”作为物理常数。
# 当前项目沿用 12.pdf 的线性移动能耗 E_mov = xi_mov * distance，
# 因此在代表速度 V_ref=15m/s 处按 Li et al. 旋翼功率模型计算
# P(15)/15 ≈ 14.73 J/m，并取整为 15 J/m 作为线性等效系数。
movement_energy_coefficient_j_per_m = 15.0
# 兼容字段：保留配置接口，不参与移动成本计算。
movement_fixed_cost = 0.0

[nodes.cloud]
# Cloud 数量固定为 1 个逻辑节点；本项目不展开 Cloud 实例列表。
# 本实验 Cloud CPU 和等效上行均使用每时隙共享总资源池。
# 正式系统公式：T_vc = psi_c * D_v / R_i + L_v / f_i。
# 资源感知卸载模式保留全部合法 Edge 与 Cloud 候选，按实际 KKT 后效用选择；
# Edge 仅在效用数值平局时优先。
# 文献来源：Al-Shareeda et al., Novel DT-assisted Vehicular Task Offloading for Cloud,
# Edge, and Hybrid Deployments, IEEE Transactions on Vehicular Technology 75(4):6565-6581, 2026,
# DOI 10.1109/TVT.2025.3620810。
# legacy_unlimited 模式使用的兼容每任务计算能力 F_c，单位 cycle/s。
cpu_cycles_per_s = 20.0e9
# legacy_unlimited 模式的兼容总 CPU 字段；finite_pool 改用 cpu_capacity_cycles_per_s。
total_cpu_cycles_per_s = 20.0e9
# Cloud有限共享CPU总池为20 GHz；这是仿真假设，不是部署测量。
resource_mode = "finite_pool"
cpu_capacity_cycles_per_s = 20.0e9
# 本次实验设计指定 Cloud 每时隙共享总等效上行能力为 20 Mbps。
# uplink_rate_bps 为兼容别名；Matching 从 total_bandwidth_bps 读取共享池上限并按任务分配速率。
# 这是抽象实验参数，不代表实际网络保证吞吐或物理可靠接入。
uplink_rate_bps = 20.0e6
# Cloud 每时隙共享总等效上行能力，单位 bit/s；保留字段并要求与 uplink_rate_bps 相等。
total_bandwidth_bps = 20.0e6
# 兼容字段，保留 false 值以兼容既有配置；总上行速率始终按共享池分配，不受此字段控制。
# Cloud CPU 总池由 resource_mode/cpu_capacity_cycles_per_s 控制；本配置使用有限共享池。
resource_sharing = false
# 当前系统公式：T_vc = psi_c * D_v / R_i + L_v / f_i，
# E_vc_vehicle = p_v * D_v / R_i；psi_c 不进入车辆无线发射能耗。
# 本次实验设计指定 Cloud 等效上行速率与时延系数；不表示实际无线覆盖、吞吐保证或显式回传链路。
# Cloud通信时延仍按 psi_cloud * D_bits / R_i 计算；车辆发送能耗只按实际无线radio airtime计算。
# psi_cloud=17.0 为本次指定的抽象实验参数。
cloud_delay_factor = 17.0

[communication]
# 本 section 集中通信模型参数，后续 Cache surrogate、Matching、KKT 必须共用。

[communication.ground]
# 地面链路参考信道增益，数学符号可对应 g_0，单位为无量纲功率增益。
# VEC 地面通信基线采用 PL(1m)=47.86dB，换算 beta_g=10^(-47.86/10)≈1.6368e-5。
# 这是文献校准实验基线，不代表硬件实测数据。
channel_gain_at_1m = 1.6368e-5
# 地面链路路径损耗指数 alpha，用于 V2V/V2I。
# VEC 地面通信基线采用 alpha_g=2.75。
# 这是文献校准实验基线，不代表硬件实测数据。
pathloss_exponent = 2.75
# 地面链路带宽，单位 Hz，用于 SV/RSU surrogate。
# 当前第一版地面 V2V/V2I 统一采用 10MHz 系统带宽。
# 这是文献校准实验基线，不代表硬件实测数据。
bandwidth_hz = 10.0e6
# Ground carrier is explicit for the V2X reference, but beta_g already includes
# its 5.9 GHz free-space reference loss. Do not add a second carrier correction.
carrier_frequency_hz = 5.9e9

[communication.air]
# 空地链路参数。最终物理通信质量由 LoS/NLoS 平均信道增益 + Shannon 速率计算。
# Urban 环境 LoS 概率参数：
# P_LoS = 1 / (1 + eta1 * exp(-eta2 * (theta - eta1)))，theta 使用 degree。
# 该 S 型概率形式来自 Al-Hourani et al., IEEE Wireless Communications Letters 2014,
# DOI 10.1109/LWC.2014.2342736。eta1=9.61、eta2=0.16 采用后续公开文献
# 中常用的 Urban 仿真参数；不声称这是 Al-Hourani 原文直接表格值。
eta1 = 9.61
eta2 = 0.16
# 载波频率，单位 Hz；用于构造 1m 参考自由空间信道增益。
# 2GHz 是空地信道公开仿真常用频点，也与 Al-Hourani 空地 pathloss 示例中的 2000MHz 一致。
carrier_frequency_hz = 2.0e9
# LoS 状态参考信道功率增益。
# beta0=(c/(4*pi*f_c))^2≈1.4228584e-4；叠加 Urban LoS 额外损耗 1dB 后
# beta_los=beta0*10^(-1/10)≈1.1302166e-4。
beta_los = 1.1302166e-4
# NLoS 状态参考信道功率增益。
# 叠加 Urban NLoS 额外损耗 20dB 后 beta_nlos=beta0*10^(-20/10)≈1.4228584e-6。
beta_nlos = 1.4228584e-6
# 自由空间 FSPL 的距离功率项对应 d^-2，因此 LoS/NLoS 参考实现均使用 alpha=2。
alpha_los = 2.0
alpha_nlos = 2.0

[communication.noise]
# Explicit version selector: unlike legacy configs, this mode integrates
# thermal noise over each task's KKT-allocated frequency bandwidth.
model = "BANDWIDTH_DEPENDENT_NOISE_V1"
# Retained only as the required legacy contract value; V1 does not use it.
noise_power_w = 3.16227766e-13
# Thermal noise density and effective receiver NF. NF is a literature-aligned
# simulation baseline that reproduces -95 dBm over 10 MHz, not measured hardware.
psd_dbm_per_hz = -174.0
receiver_noise_figure_db = 9.0

[communication.resource_model]
# Each node has an ideal independent orthogonal frequency pool; no inter-node
# co-channel interference is modeled in this first-stage contract.
inter_node_spectrum = "ORTHOGONAL_INDEPENDENT"
interference = "NONE"

[communication.cloud]
# 共享总等效上行速率的兼容别名，须与nodes.cloud.uplink_rate_bps相等。
uplink_rate_bps = 20.0e6

[cache]
# Cache/UAV prediction/configuration surrogate 的 horizon 折扣 beta；
# 这是 ALGORITHM_DESIGN 参数，不属于用户确认的 system-model 物理合同。
discount_beta = 0.95
# 正式 episode 初始 cache 使用 uniform feasible initialization。
knapsack_initialization = "uniform_feasible"

[cache.capacity_policy]
# cache 容量由统一 artifact 入口根据 service_catalog 总大小自动换算为 MB；
# 以下比例是正式配置的唯一容量规则，不在配置中复制服务大小。
tv_ratio = 0.05
sv_ratio = 0.1074963773776571
rsu_ratio = 0.22395078620345232
uav_ratio = 0.17916062896276186

[objective]
# 主实验采用时延权重 0.5、车辆能耗权重 0.5。
# 该值属于实验设计参数，不是硬件物理常数或已确认数据。
# 后续敏感性实验使用：(omega_T, omega_E) = (0.3,0.7), (0.5,0.5), (0.7,0.3)。
omega_delay = 0.5
# 主实验采用时延权重 0.5、车辆能耗权重 0.5。
# 该值属于实验设计参数，不是硬件物理常数或已确认数据。
# 后续敏感性实验使用：(omega_T, omega_E) = (0.3,0.7), (0.5,0.5), (0.7,0.3)。
omega_energy = 0.5
# Cache 只惩罚实际新增服务下载时延：T_ca,m=sum_f(8e6*s_f_MB/R_m_back,bps)*max(c_new-c_old,0)。
# 服务大小为十进制 MB、速率为 bit/s，换算因子 8e6 bit/MB；删除服务不产生下载成本。
# 环境初始化固定 T_ca_upper=sum_m(8e6*cache_capacity_m_MB/R_m_back,bps)，这是容量上界，不声称可由离散服务目录精确达到。
# C_ca_norm(t)=sum_m T_ca,m(t)/T_ca_upper；beta_ca=lambda_cache*T_ca_upper，将既有 1/s 系数换算为无量纲权重。
# Cache 成本只由执行前后实际配置计算，UPDATE 意图本身不计费。
lambda_cache = 2.0e-5
# E_mov,u=xi_mov,u*||q_u(t)-q_u(t-1)||_2，使用实际二维水平位置差，单位 J。
# 环境初始化固定 E_mov_upper=sum_u(xi_mov,u*vmax_u*dt)，是单 UAV 速度约束上界；联合安全距离和边界可能使精确最大值更小。
# C_q_norm(t)=sum_u E_mov,u(t)/E_mov_upper；beta_q=lambda_movement*E_mov_upper，将既有 1/J 系数换算为无量纲权重。
# 仅实际位置变化产生能耗；MOVE 标签不单独计费。movement_fixed_cost 保留为兼容字段且不参与计算。
lambda_movement = 5.0e-6
# Fixed system-level conservative upper bounds for task utility (not training P95).
# D_max=1000 KB*8000 bit/KB*(1+0.20)=9.6e6 bit;
# L_max=1000 cycle/bit*D_max*(1+0.10)=10.56e9 cycle.
# KKT floors are 1e-6: F_min is 1000 cycle/s on the 1 GHz SV; minimum Cloud
# rate is 20 Mbps*1e-6=20 bit/s. At the SUMO boundary diagonal (2664.329 m),
# the minimum edge rates are 119.381 bit/s (ground) and 169.464 bit/s (air),
# so 20 bit/s is a conservative common radio-rate lower bound. Cloud psi_c=17
# applies to delay only. T_ref stores max_r(T_r_upper), with
# T_r_upper=psi_r*D_max/R_r_min+L_max/F_r_min; the maximum is the SV path.
# E_ref stores max_r(P_tx*D_max/R_r_min); the maximum is the Cloud uplink path.
# These legacy config keys are fixed upper-bound references in seconds and joules.
T_ref = 10640415.0
E_ref = 95772.59112

[objective.cost_normalization]
contract_version = "max_feasible_cost_upper_bounds_v1"
cache_method = "max_feasible_delay_capacity_upper_bound"
cache_reference_formula = "sum_m(8e6 * cache_capacity_m_MB / actual_backhaul_rate_m_bps)"
movement_method = "max_feasible_energy_single_uav_speed_upper_bound"
movement_reference_formula = "sum_u(xi_mov_u_J_per_m * vmax_u_m_per_s * dt_s)"
movement_distance_model = "horizontal_2d_euclidean"
beta_cache_source = "objective.lambda_cache_per_s * T_ca_upper_s"
beta_movement_source = "objective.lambda_movement_per_J * E_mov_upper_J"

