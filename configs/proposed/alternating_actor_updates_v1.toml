gru_checkpoint_path = "data/generated/popularity_gru.pt"

[algorithm.cache]
# 面向正式联合策略的 Cache 重配置候选。策略读取有界且确定性的目标缓存配置；
# ADD/DELETE/SWAP 只表示两个二值配置之间可能出现的物理差异，不是候选动作类型。
enabled = true
method = "knapsack_local_search"
max_coordinate_rounds = 20
tolerance = 1.0e-9
# 目标配置候选的张量宽度上限。该值可配置且不宣称为最优值；正式长训练前应依据
# Train/Dev 候选召回率进行校准。
target_candidate_capacity = 64
# 用于确定性生成当前配置到需求配置之间中间目标的比例。
target_intermediate_fractions = [0.25, 0.5, 0.75]

[algorithm.uav]
# 为每个 slot 的 Micro PPO 生成可行 MOVE 候选及其描述特征；当前 UAV 位置由策略作为
# candidate 0 / STAY 加入。这里提供候选，不独立决定 STAY/MOVE 或重配置时机。
enabled = true
method = "demand_aware_target_position"
# 以下均为算法超参数，不是物理系统参数，不加入 FORMAL_SYSTEM_PARAMETER_KEYS。
coarse_num_angles = 16
coarse_radius_fractions = [0.25, 0.5, 0.75, 1.0]
refine_rounds = 2
refine_num_angles = 12
refine_radius_shrink = 0.5
# 与需求锚点配合使用的局部几何候选参数；这些值控制候选生成，不代表物理移动限制。
exploration_num_angles = 8
exploration_radius_fractions = [0.5, 1.0]
demand_anchor_scales = [0.5, 1.0]
target_candidate_capacity = 24
max_coordinate_rounds = 10
position_tolerance_m = 1.0e-6
objective_tolerance = 1.0e-9

[algorithm.configuration]
# 正式双时间尺度 PPO 直接传入最终 Cache/UAV 配置，因此默认关闭旧外层坐标优化路径。
# 坐标优化 helper 与物理候选生成代码保留给显式诊断；正式 slot 执行只调用 Matching/KKT。
enabled = false
method = "cache_uav_coordinate"
max_outer_rounds = 10
objective_tolerance = 1.0e-9
# 仅控制 evaluator 并行度；1 表示完全串行执行。该设置不改变候选顺序、配置算法或系统模型。
prediction_batch_parallel_workers = 8

[algorithm.kkt]
# 数值实现保护常数，不是物理参数，也不是文献硬件参数。
# 对应 12.pdf 中的 epsilon_w / epsilon_b，仅用于避免分母为0。
# 当前每slot最多9个TV任务，因此 1e-6 不会形成实际资源瓶颈。
min_cpu_fraction = 1.0e-6
min_bandwidth_fraction = 1.0e-6
bisection_tolerance = 1.0e-12
max_bisection_iterations = 100

[algorithm.matching]
# Transfer-Exchange Matching 算法及数值停止参数，不是物理系统参数。
# max_updates仅作为有限运行保护；若因无严格改进操作停止，
# 才称为transfer-exchange stable；若因max_updates停止，只保证当前matching可行。
enabled = true
method = "transfer_exchange"
max_updates = 100
objective_tolerance = 1.0e-9
# 保留所有合法 Edge 候选与 Cloud 后备候选，并依据完整 KKT 后的 Task Utility 选择。
cloud_fallback_mode = "RESOURCE_AWARE_FALLBACK"

[algorithm.ppo]
# When：Macro 每个 frame 起点选 Cache；slot 执行后可决定结束 holding；Micro 每 slot 决策 UAV 位置。
# What：Macro 使用 Unified Cache candidate 与 sampled holding termination；Micro 顺序选择 UAV0/UAV1 统一位置候选。
# Where：动作与 mask 在 src/ppo_simple/{policy,rollout,trainer}.py；真实执行在 slot_environment.py。
# Cache candidate 0=当前配置 KEEP；UAV candidate 0=当前位置 STAY。
# Exact-Q 仅保留 diagnostic 能力，正式训练关闭；不改变当前物理系统模型。
enabled = true
method = "PROPOSED"
configuration_control_mode = "macro_cache_smdp_micro_uav_candidate"
policy_schema = "adaptive_dual_timescale_proposed_cache_economic_features_fixed_lr_horizon_mask_v5_multi_node_cache_factorized_v1_keep_node_identity_v1_per_slot_analytic_task_model_v1_training_p95_reward_norm_v1"
task_execution_model = "PER_SLOT_ANALYTIC"
cache_action_mode = "MULTI_NODE_FACTORIZED"
cache_reconfiguration_model = "ABSTRACT_MACRO_BOUNDARY_RECONFIGURATION"
macro_cache_enabled = true
# 开启自适应 Cache holding；每次至少保持 1 个 slot，最多保持 5 个 slot。
adaptive_holding_enabled = true
adaptive_holding_min_slots = 1
adaptive_holding_max_slots = 5
macro_full_batch = true
exact_q_training_enabled = false
critic_mc_warmup_required = false
uav_unified_candidate_policy = true
uav_autoregressive = true
uav_group_balance = true
hidden_sizes = [128, 128]
# PPO 算法参数，不属于系统物理模型。
gamma = 1.0
gae_lambda = 0.95
clip_epsilon = 0.2
learning_rate = 3.0e-4
actor_learning_rate = 3.0e-4
critic_learning_rate = 1.0e-3
macro_critic_learning_rate = 1.0e-3
# 每四个独立 realization 在同一冻结策略下采样后，执行一次 PPO policy update。
realizations_per_policy_update = 4
# 每组仍由 Macro/Micro 共同采集 4 个 Episode，Actor 更新组交替；首组只更新 Micro Actor。
actor_update_mode = "ALTERNATING"
actor_update_first = "MICRO"
actor_update_period = 1
# 所有优化器在300 Episode / 75 Policy Update内保持固定学习率。
macro_actor_learning_rate = 5.0e-4
macro_actor_final_learning_rate = 5.0e-4
optimizer_learning_rate_schedule = "constant"
macro_actor_learning_rate_schedule = "constant"
macro_critic_target_mode = "two_step_smdp_td"
long_value_enabled = true
long_value_target = "realized_return_to_go"
long_value_learning_rate = 1.0e-3
long_value_steps_per_update = 50
long_value_max_grad_norm = 0.5
micro_critic_learning_rate = 3.0e-3
value_loss_coefficient = 0.01
# Micro STAY/MOVE 二元组熵下限；具体熵值由代码根据软概率上限推导。
micro_group_probability_soft_cap = 0.90
micro_group_entropy_floor_coefficient = 0.05
entropy_coefficient = 0.0
max_grad_norm = 0.5
# 每个完整 episode 收集完毕后先更新 Micro，再用全部 Macro frames full-batch 更新。
update_epochs = 4
macro_critic_steps_per_update = 50
macro_critic_replay_history_episodes = 0
# Macro 与 Micro PPO 分别使用独立的 KL early-stop 阈值。
macro_target_kl = 0.10
micro_target_kl = 0.02
num_minibatches = 10
minibatch_size = 30

[algorithm.ppo.data_protocol]
# 独立的完整 Episode 协议。每个训练 realization 的 0..299 均用于训练；
