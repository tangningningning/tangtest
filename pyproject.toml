[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-cache-mec"
version = "0.1.0"
description = "Adaptive cache and MEC research environment"
requires-python = ">=3.10"

[project.scripts]
ppo-train = "ppo.ppo_training:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["common*", "scenario*", "decision*", "ppo*"]
namespaces = true
