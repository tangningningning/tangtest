# adaptive_cache_mec 单一配置文件。
#
# 这里的参数服务于论文仿真；论文理论以同目录 11.pdf 和 paper_spec.md 为准。
# 当前配置为 F=10 最终系统模型及 Reference Solver/SB3 PPO 接口准备配置。
# 系统模型、资源分配、Cache/UAV 成本和策略初始化已完成定版。
# Reference 模式默认独立运行；本阶段不加载 checkpoint，也不启动 PPO 训练。

project:
  # 项目标识；用于日志、随机数管理和后续实验结果标识。
  name: adaptive_cache_mec
  # 全局默认随机种子。各数据子模块仍使用下方独立种子，便于复现实验。
  seed: 4401
  # 当前有效的论文规范缓存；当 11.pdf 哈希未变化时，优先读取该规范缓存。
  paper_spec: paper_spec.md

simulation:
  # SUMO仿真总时间范围，单位为秒。begin_s/end_s对应场景时间，不是训练次数。
  begin_s: 0.0
  end_s: 600.0
  # 长时标优化区间。前100秒用于场景预热，后续决策时隙从100秒开始。
  optimization_begin_s: 100.0
  optimization_end_s: 600.0
  # 决策时隙长度。当前论文场景按5秒一个时隙组织轨迹、请求和状态数据。
  decision_interval_s: 5.0
  # 优化区间内的时隙数：(optimization_end_s-optimization_begin_s)/decision_interval_s。
  slot_count: 100

sumo:
  # 使用新项目内原样迁入的郑州正式路网，不下载、重建或改写SUMO文件。
  # data.py通过官方TraCI/libsumo接口读取车辆和仿真状态，不实现自定义通信协议。
  # .sumocfg和route文件保持原工程相对目录结构，避免改变内部相对引用。
  # 使用压缩网络文件是原正式场景的实际格式。
  backend: traci
  network_file: data/sumo/map/osm.net.xml.gz
  configuration_file: data/sumo/paper_10v/paper_10v.sumocfg
  # null表示由SUMO环境自行发现可执行文件；也可在本机固定sumo或sumo-gui路径。
  executable: null
  # 导入数据模块时不自动启动SUMO；只有显式调用数据接口时才启动外部场景。
  start_on_load: false

mobility:
  # PPO/Reference正式运行只回放已生成的SUMO真值；缺失轨迹时直接报错，不回退在线SUMO。
  source: trace
  trace_root: data/mobility_traces/default
  schema_version: 1

vehicle_roles:
  # 角色数量只由配置控制，车辆身份始终使用SUMO原始vehicle_id。
  num_task_vehicles: 10
  num_service_vehicles: 2
  # 服务车辆仅使用当前状态计算驻留和覆盖评分；后续可替换评分实现。
  service_score_alpha: 0.5
  service_v2v_range_m: 300.0
  min_service_stay_s: 10.0
  service_stay_horizon_s: 60.0
  service_exit_margin_m: 25.0

services:
  # F=10基准服务种类总数；服务流行度向量、GRU输出和缓存动作维度均动态使用该值。
  # F=20作为后续服务数量敏感性/压力实验，不在本轮基准配置中使用。
  count: 10
  # 当前只保留均匀区间采样的配置接口；服务大小不是请求输入大小。
  size_mode: uniform
  # 服务大小下界，单位MB，包含下界。
  min_size_mb: 1000
  # 服务大小上界，单位MB，包含上界。
  max_size_mb: 2000
  # 服务大小生成的独立随机种子，不影响车辆轨迹和请求到达随机数。
  generation_seed: 4401

rsu:
  # RSU固定坐标，单位米，使用原路网坐标系；顺序对应RSU节点编号。
  positions_m:
    - [4010.65, 920.46]
    - [4484.62, 1227.67]

uav:
  # UAV初始二维水平位置，单位米；高度单独由altitude_m给出。
  initial_positions_m:
    - [3574.81, 986.375]
    - [4668.91, 986.375]
  # UAV固定飞行高度，单位米。
  altitude_m: 100.0
  # UAV最大移动速度，单位m/s；用于后续UAV可行性约束。
  max_speed_mps: 25.0
  # UAV之间的最小安全距离，单位米；用于后续位置可行化检查。
  minimum_safety_distance_m: 100.0
  # UAV水平移动线性能耗系数，单位J/m；对应论文的 xi_u^mov。
  movement_energy_j_per_m: 5.4e-05
  # UAV最终位置确实改变时产生的固定更新成本，对应论文的 eta_u^q。
  fixed_update_cost: 1.08e-4
  # UAV移动能耗折算到系统成本的权重，对应论文的 lambda^mov。
  movement_energy_cost_weight: 0.02
  # UAV允许活动区域，单位米，来源于原郑州路网边界对应的有效区域。
  region:
    x_min_m: 3027.76
    x_max_m: 5215.96
    y_min_m: 226.37
    y_max_m: 1746.38

communication:
  # 各类边缘节点的无线带宽，统一使用MHz；代码读取后只做MHz到Hz的单位换算。
  # sv/rsu/uav分别对应服务车辆、RSU和UAV，不在这里重复写完整字段名。
  bandwidth_mhz:
    sv: 10.0
    rsu: 20.0
    uav: 20.0
  # 任务车辆发射功率，单位W。
  tx_power_w: 0.2
  # 总噪声功率，单位 dBm；loader 读取后转换为内部 W。
  noise_power_dbm: -104.0
  # 地面链路参考信道增益，无量纲；后续按论文路径损耗模型使用。
  reference_channel_gain: 0.001
  # 地面链路路径损耗指数。
  terrestrial_path_loss_exponent: 3.0
  # 空地LoS/NLoS参考功率增益，单位 dB；loader 读取后转换为内部线性增益。
  # 当前工程参考为 fc=2 GHz、LoS附加损耗1 dB、NLoS附加损耗20 dB。
  air_reference_gain_los_db: -39.468
  air_reference_gain_nlos_db: -58.468
  # 空地LoS/NLoS路径损耗指数；该参考模型的距离项为自由空间d^(-2)。
  air_path_loss_exponent_los: 2.0
  air_path_loss_exponent_nlos: 2.0
  # 经典城市环境的LoS概率S形参数：
  # P_L=1/[1+eta_1*exp(-eta_2*(theta_deg-eta_1))]，theta_deg为角度制。
  los_eta_1: 9.61
  los_eta_2: 0.16

computation:
  # 各类节点的CPU能力，统一使用GHz；字段名已包含单位，代码读取后换算为Hz。
  # tv/sv/rsu/uav/cloud分别对应任务车辆、服务车辆、RSU、UAV和Cloud。
  capacity_ghz:
    tv: 4.0
    sv: 8.0
    rsu: 30.0
    uav: 15.0
    cloud: 80.0
  # CPU动态能耗系数；数值和使用方式必须由论文能耗公式决定。
  cpu_switching_capacitance: 1.0e-28

resource_allocation:
  # 论文C13中的计算资源比例严格正下界 epsilon_w；这是当前正式仿真参数，
  # 不随task_count动态变化。0.01表示每个分配到edge node的任务至少获得1%的CPU比例。
  epsilon_compute: 0.01
  # 论文C15中的共享带宽比例严格正下界 epsilon_b；这是当前正式仿真参数，
  # 不随task_count动态变化。0.01表示每个分配到edge node的任务至少获得1%的带宽比例。
  epsilon_bandwidth: 0.01

cloud:
  # Cloud无线接入等效上传速率，单位 Mbps；loader 读取后转换为内部 bit/s。
  upload_rate_mbps: 50.0
  # Cloud传输时延扩展系数 psi_c，仅用于等效回传/核心网附加时延。
  delay_expansion_psi: 7.0

cache:
  # 各类节点的缓存容量，统一使用MB；字段名已包含单位，knapsack直接使用同一语义。
  # tv/sv/rsu/uav分别对应任务车辆、服务车辆、RSU和UAV。
  # 当前正式基准采用方案B：RSU=5120MB、UAV=4096MB；A/B比较只在内存副本中交换。
  capacity_mb:
    tv: 2048.0
    sv: 2048.0
    rsu: 5120.0
    uav: 4096.0
  # 1个缓存容量整数单位对应的字节数；用于后续离散化，不改变服务大小单位说明。
  integer_unit_bytes: 1000000
  # 节点加载缓存内容的单位能耗，单位J/bit。
  load_energy_j_per_bit:
    service_vehicle: 2.0e-11
    rsu: 2.0e-11
    uav: 2.0e-11
  # 缓存更新固定代价；具体是否计入reward必须遵循论文定义。
  fixed_update_cost:
    service_vehicle: 0.004
    rsu: 0.004
    uav: 0.004
  # 能耗在系统效用/reward中的权重；与delay_weight共同使用时需保持论文归一化约定。
  energy_cost_weight: 0.05

cache_controller:
  # reference复现既有G_cache触发；ppo只在显式切换到ppo模式时接管KEEP/UPDATE。
  mode: reference

workload:
  # 每个任务车辆在每个时隙产生请求的伯努利概率。
  task_arrival_probability: 0.5
  # Zipf服务流行度指数；指数越大，排名靠前的服务请求越集中。
  zipf_exponent: 0.8
  # 服务流行度分布保持不变的时隙数；到达变化时重新生成请求服务类型分布。
  popularity_change_interval_slots: 20
  # 请求输入数据量单位；生成后转换成bit供后续传输/时延计算使用。
  task_input_size_unit: Mbit
  task_input_size_min: 0.5
  task_input_size_max: 1.5
  # 请求计算量单位；生成后转换成CPU cycles供后续资源分配使用。
  task_cpu_cycles_unit: Gcycle
  task_cpu_cycles_min: 0.5
  task_cpu_cycles_max: 1.5
  # 请求到达随机数种子。
  arrival_seed: 4201
  # 分块服务流行度随机数种子。
  popularity_seed: 4202
  # 请求服务类型随机数种子。
  service_request_seed: 4203
  # 请求输入大小随机数种子。
  task_input_seed: 4204

prediction:
  # 旧GRU baseline输入历史长度，正式移动感知预测器不读取该字段。
  history_length_slots: 10
  # Kalman只负责缺少道路元数据时的离线位置兼容预测，不参与正式服务流行度预测。
  kalman:
    # 位置观测噪声标准差，单位米。
    measurement_noise_std_m: 1.0
    # 等效加速度噪声标准差，单位m/s^2。
    acceleration_noise_std_mps2: 1.0
    # 初始位置状态方差，单位m^2。
    initial_position_variance_m2: 4.0
    # 初始速度状态方差，单位m^2/s^2。
    initial_velocity_variance_m2ps2: 4.0
    # 是否将预测位置裁剪到配置的UAV/路网区域边界内。
    clip_to_region: true
  # 旧GRU baseline参数；本轮正式路径不加载、不训练、不生成checkpoint。
  gru:
    # GRU隐状态维度。
    hidden_size: 32
    # GRU层数；当前论文缓存规范对应单层最小结构。
    num_layers: 1
    # 旧GRU仅作为离线对照实现保留；正式路径不读取该checkpoint。
    checkpoint_file: null

trajectory_prediction:
  # 第一阶段只预测一条概率最高的道路路径，不生成多分支树。
  horizon_slots: 3
  max_path_branches: 1
  # 在线历史只保留最近若干个当前观测；全局道路转移计数单独保留。
  history_length_slots: 10

popularity_prediction:
  # 单一历史EWMA衰减；预测slot只读取更早slot已登记的请求。
  history_decay: 0.8
  # 车辆历史偏好与全局先验的简单平滑强度。
  preference_smoothing: 1.0

data:
  # 本轮基准直接由data.py生成请求工作负载，并使用本项目内正式SUMO场景。
  # 若后续接入冻结轨迹/工作负载，可在这里填写项目内相对路径。
  trajectory_file: null
  workload_file: null

reward:
  # 时延归一化参考值，单位秒；后续reward实现需与论文效用定义核对。
  reference_delay_s: 2.0
  # 能耗归一化参考值，单位焦耳。
  reference_energy_j: 0.2
  # 时延项权重。
  delay_weight: 0.5
  # 能耗项权重。
  energy_weight: 0.5

ppo:
  # 默认不自动训练；Stage15 只能由 train_ppo.py --stage15 显式启动。
  enabled: false
  seed: 20260811
  train_seed_base: 20260811
  # Stage15 固定 observation 与 VecNormalize 配置。
  norm_obs: true
  norm_reward: true
  clip_obs: 10.0
  # Stage13/14 历史受控复验使用的旧 held-out seed，保留用于历史入口兼容。
  eval_seed: 20261811
  eval_seeds: [20261811, 20261812, 20261813, 20261814, 20261815]
  # Stage15 validation：只用于 checkpoint 选择，不用于 test 结论。
  validation_seeds: [20271811, 20271812, 20271813, 20271814, 20271815]
  # Stage15 test：训练和 best checkpoint 选择期间禁止读取。
  test_seeds: [20281811, 20281812, 20281813, 20281814, 20281815, 20281816, 20281817, 20281818, 20281819, 20281820]
  eval_freq: 5120
  checkpoint_updates: [20, 40, 60, 80, 100]
  best_model_criterion: mean_original_validation_system_reward
  hard_stop_on: [future_request_leakage, future_trajectory_leakage, cache_capacity_violations, compute_violations, bandwidth_violations, uav_violations, invalid_service_ids, invalid_node_ids, nan_inf_count, kkt_failure_count, action_mismatch]
  test_after_best_only: true
  # 已验证的标准 SB3 PPO 参数，Stage15 全程固定。
  gamma: 0.99
  gae_lambda: 0.95
  learning_rate: 0.0003
  n_steps: 256
  batch_size: 64
  n_epochs: 10
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  total_timesteps: 25600
  # 第一轮环境计算成本主要来自 SUMO/Matching/KKT，固定先用 CPU。
  device: cpu

training:
  # 与旧训练实现解耦；作为 PPO 入口未指定 ppo.device 时的兼容回退。
  device: auto

output:
  # 后续实验输出根目录。当前阶段不向outputs写检查结果。
  root: outputs
  # 后续metrics表文件名。
  metrics_file: metrics.csv
  # 后续最佳模型checkpoint文件名。
  best_checkpoint: best.pt
  # 后续最终模型checkpoint文件名。
  final_checkpoint: final.pt
  # 后续绘图目录名。
  figures_dir: figures
